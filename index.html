<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quiz BIOTECNOLOGIE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- MathJax per le formule LaTeX -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [
                    ['$', '$'],
                    ['\\(', '\\)']
                ],
                displayMath: [
                    ['$$', '$$'],
                    ['\\[', '\\]']
                ]
            },
            svg: {
                fontCache: 'global'
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async id="MathJax-script"></script>

    <style>
        :root {
            --bg: #080f0c;
            --bg-card: #111d18;
            --bg-card-alt: #162520;
            --primary: #34d399;
            --primary-dim: rgba(52, 211, 153, 0.12);
            --accent: #e5a930;
            --accent-dim: rgba(229, 169, 48, 0.12);
            --text: #e4ece7;
            --text-muted: #6e8a7d;
            --correct: #22c55e;
            --correct-bg: rgba(34, 197, 94, 0.07);
            --correct-border: rgba(34, 197, 94, 0.35);
            --wrong: #f43f5e;
            --wrong-bg: rgba(244, 63, 94, 0.07);
            --wrong-border: rgba(244, 63, 94, 0.35);
            --border: #1a2e25;
            --border-light: #244035;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: 'Source Sans 3', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 15% 30%, rgba(52, 211, 153, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 70%, rgba(229, 169, 48, 0.035) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(52, 211, 153, 0.03) 0%, transparent 40%);
            animation: bgPulse 18s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes bgPulse {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0.6;
                transform: scale(1.08) translateY(-20px);
            }
        }
        h1,
        h2,
        h3 {
            font-family: 'Playfair Display', serif;
        }

        .screen {
            position: relative;
            z-index: 1;
            display: none;
        }
        .screen.active {
            display: flex;
        }

        /* Setup */
        #setup-screen {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: calc(var(--safe-top) + 2rem) 1rem calc(var(--safe-bottom) + 2rem);
        }
        .setup-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .setup-card .logo-icon {
            width: 56px;
            height: 56px;
            background: var(--primary-dim);
            border: 1px solid var(--correct-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            color: var(--primary);
            font-size: 1.5rem;
        }

        /* Lista / Select gerarchica */
        .area-selector {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .area-selector label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .area-selector select,
        .area-selector .list-box {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.95rem;
            padding: 0.7rem 1rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .area-selector select:focus,
        .area-selector .list-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-dim);
        }
        .area-selector .list-box {
            height: 180px;
            padding: 0.5rem;
            overflow-y: auto;
        }
        .area-selector .list-box option {
            padding: 0.45rem 0.75rem;
            border-radius: 6px;
            margin-bottom: 2px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .area-selector .list-box option:hover {
            background: var(--bg-card-alt);
        }
        .area-selector .list-box option:checked {
            background: var(--primary-dim);
            color: var(--primary);
        }
        .area-selector .list-box optgroup {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 0.5rem 0.75rem 0.15rem;
        }

        .num-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Source Sans 3', sans-serif;
            font-size: 1rem;
            padding: 0.7rem 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .num-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-dim);
        }

        .btn-primary {
            width: 100%;
            padding: 0.85rem 1.5rem;
            background: var(--primary);
            color: #080f0c;
            font-family: 'Source Sans 3', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.02em;
        }
        .btn-primary:hover {
            background: #4ade80;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(52, 211, 153, 0.25);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            padding: 0.7rem 1.5rem;
            background: transparent;
            color: var(--primary);
            font-family: 'Source Sans 3', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: var(--primary-dim);
            border-color: var(--primary);
        }

        /* Quiz */
        #quiz-screen {
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: calc(var(--safe-top) + 1.5rem) 1rem calc(var(--safe-bottom) + 3rem);
        }
        .quiz-container {
            width: 100%;
            max-width: 700px;
        }
        .progress-track {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #4ade80);
            border-radius: 3px;
            transition: width 0.4s ease;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 40px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25));
            animation: shimmer 1.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%,
            100% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
        }

        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 2rem 1.75rem;
            margin-top: 1rem;
        }
        .question-area-badge {
            display: inline-block;
            padding: 0.25rem 0.7rem;
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: 6px;
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
            max-width: 100%;
            word-break: break-word;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.6;
            color: var(--text);
        }
        .question-text .math {
            font-weight: 400;
        }

        .options-list {
            margin-top: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }
        .option-btn {
            display: flex;
            align-items: flex-start;
            gap: 0.85rem;
            width: 100%;
            text-align: left;
            padding: 1rem 1.15rem;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Source Sans 3', sans-serif;
            font-size: 1rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.18s;
            -webkit-tap-highlight-color: transparent;
        }
        .option-btn:hover:not(.locked) {
            border-color: var(--border-light);
            background: var(--bg-card-alt);
        }
        .option-btn.selected:not(.locked) {
            border-color: var(--primary);
            background: var(--primary-dim);
        }
        .option-btn .opt-letter {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: all 0.18s;
        }
        .option-btn.selected:not(.locked) .opt-letter {
            background: var(--primary);
            color: #080f0c;
        }
        .option-btn.locked {
            cursor: default;
        }
        .option-btn.correct-answer {
            border-color: var(--correct-border) !important;
            background: var(--correct-bg) !important;
        }
        .option-btn.correct-answer .opt-letter {
            background: var(--correct) !important;
            color: #fff !important;
        }
        .option-btn.wrong-selected {
            border-color: var(--wrong-border) !important;
            background: var(--wrong-bg) !important;
        }
        .option-btn.wrong-selected .opt-letter {
            background: var(--wrong) !important;
            color: #fff !important;
        }
        .option-btn.dimmed {
            opacity: 0.45;
        }

        .feedback-box {
            margin-top: 1.25rem;
            border-radius: 12px;
            padding: 1.25rem 1.35rem;
            animation: slideDown 0.35s ease;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .feedback-box.correct {
            background: var(--correct-bg);
            border: 1px solid var(--correct-border);
        }
        .feedback-box.wrong {
            background: var(--wrong-bg);
            border: 1px solid var(--wrong-border);
        }
        .feedback-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.65rem;
        }
        .feedback-box.correct .feedback-title {
            color: var(--correct);
        }
        .feedback-box.wrong .feedback-title {
            color: var(--wrong);
        }
        .spiegazione-box {
            margin-top: 0.85rem;
            padding: 1rem 1.15rem;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent);
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            line-height: 1.65;
            color: #c5d4cb;
        }
        .spiegazione-label {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.35rem;
        }

        /* Risultati */
        #results-screen {
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: calc(var(--safe-top) + 2rem) 1rem calc(var(--safe-bottom) + 3rem);
        }
        .results-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .score-ring {
            margin: 0 auto 1.25rem;
        }
        .score-ring circle {
            transition: stroke-dashoffset 1.2s ease;
        }
        .review-item {
            text-align: left;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.15rem 1.25rem;
            margin-bottom: 0.75rem;
        }
        .review-item.was-correct {
            border-left: 3px solid var(--correct);
        }
        .review-item.was-wrong {
            border-left: 3px solid var(--wrong);
        }
        .review-q-text {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.55;
            color: var(--text);
            margin-bottom: 0.75rem;
        }
        .review-opt-row {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            padding: 0.45rem 0.55rem;
            border-radius: 7px;
            font-size: 0.9rem;
            line-height: 1.45;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .review-opt-row.rev-correct {
            background: var(--correct-bg);
            color: var(--correct);
            font-weight: 600;
        }
        .review-opt-row.rev-wrong {
            background: var(--wrong-bg);
            color: var(--wrong);
            font-weight: 600;
        }
        .review-opt-letter {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .review-opt-row.rev-correct .review-opt-letter {
            background: var(--correct);
            color: #fff;
        }
        .review-opt-row.rev-wrong .review-opt-letter {
            background: var(--wrong);
            color: #fff;
        }
        .review-status-icon {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .review-status-icon.is-correct {
            color: var(--correct);
        }
        .review-status-icon.is-wrong {
            color: var(--wrong);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        @media (max-width: 640px) {
            .setup-card {
                padding: 1.75rem 1.25rem;
            }
            .question-card {
                padding: 1.5rem 1.25rem;
            }
            .question-text {
                font-size: 1.08rem;
            }
            .area-selector .list-box {
                height: 160px;
                font-size: 0.85rem;
            }
        }
        @media (max-width: 430px) {
            .setup-card {
                padding: 1.5rem 1.15rem;
                border-radius: 14px;
            }
            .setup-card .logo-icon {
                width: 46px;
                height: 46px;
                font-size: 1.2rem;
                border-radius: 11px;
            }
            .setup-card h1 {
                font-size: 1.3rem !important;
            }
            .area-selector .list-box {
                height: 140px;
                font-size: 0.82rem;
                border-radius: 8px;
            }
            .num-input {
                font-size: 0.95rem;
                padding: 0.6rem 0.8rem;
            }
            #quiz-screen {
                padding: calc(var(--safe-top) + 0.75rem) 0.7rem calc(var(--safe-bottom) + 2rem);
            }
            .question-card {
                padding: 1.2rem 1rem;
                border-radius: 11px;
                margin-top: 0.6rem;
            }
            .question-area-badge {
                font-size: 0.7rem;
                padding: 0.2rem 0.55rem;
                margin-bottom: 0.7rem;
            }
            .question-text {
                font-size: 1rem;
                line-height: 1.5;
            }
            .options-list {
                gap: 0.45rem;
                margin-top: 1rem;
            }
            .option-btn {
                padding: 0.7rem 0.85rem;
                font-size: 0.9rem;
                line-height: 1.45;
                gap: 0.7rem;
                border-radius: 9px;
            }
            .option-btn .opt-letter {
                width: 27px;
                height: 27px;
                font-size: 0.8rem;
                border-radius: 7px;
            }
            .feedback-box {
                padding: 1rem 1rem;
                margin-top: 1rem;
                border-radius: 10px;
            }
            .feedback-title {
                font-size: 0.95rem;
            }
            .spiegazione-box {
                font-size: 0.88rem;
                padding: 0.8rem 0.9rem;
            }
            .spiegazione-label {
                font-size: 0.76rem;
            }
            .btn-primary {
                padding: 0.75rem 1rem;
                font-size: 0.95rem;
                min-height: 44px;
            }
            .btn-secondary {
                padding: 0.6rem 1rem;
                font-size: 0.88rem;
                min-height: 44px;
            }
            .results-card {
                padding: 1.75rem 1.15rem;
                border-radius: 14px;
            }
            .review-item {
                padding: 0.9rem 1rem;
                margin-bottom: 0.6rem;
            }
            .review-q-text {
                font-size: 0.88rem;
                margin-bottom: 0.6rem;
            }
            .review-opt-row {
                font-size: 0.83rem;
                padding: 0.35rem 0.45rem;
                gap: 0.5rem;
            }
            .review-opt-letter {
                width: 22px;
                height: 22px;
                font-size: 0.7rem;
                border-radius: 5px;
            }
        }
        @media (max-width: 359px) {
            .option-btn {
                font-size: 0.85rem;
                padding: 0.6rem 0.7rem;
                gap: 0.55rem;
            }
            .option-btn .opt-letter {
                width: 24px;
                height: 24px;
                font-size: 0.73rem;
            }
            .question-text {
                font-size: 0.95rem;
            }
            .review-q-text {
                font-size: 0.84rem;
            }
            .review-opt-row {
                font-size: 0.8rem;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Area selezionata nel setup */
        .selected-areas-info {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .selected-areas-info .tag {
            background: var(--primary-dim);
            color: var(--primary);
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .selected-areas-info .tag.main-tag {
            background: var(--accent-dim);
            color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- ============ SETUP ============ -->
    <div id="setup-screen" class="screen active">
        <div class="setup-card">
            <div class="logo-icon"><i class="fa-solid fa-stethoscope"></i></div>
            <h1 class="text-2xl mb-1" style="color:var(--text);">Quiz</h1>
            <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:1.75rem;">
                <span id="setup-title">Seleziona le aree tematiche</span>
            </p>

            <div class="area-selector">
                <label for="main-area-select">Area principale</label>
                <select id="main-area-select" class="num-input">
                    <option value="">-- Caricamento aree --</option>
                </select>
            </div>

            <div class="area-selector" style="margin-top:1rem;">
                <label>Sottoaree selezionate <span id="sub-count" style="font-weight:400;text-transform:none;color:var(--text-muted);">(0)</span></label>
                <select id="sub-area-select" class="list-box" multiple aria-label="Seleziona le sottoaree"></select>
                <div class="selected-areas-info" id="selected-areas-info"></div>
            </div>

            <div style="margin-top:1.25rem;">
                <label for="num-questions" style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:0.4rem; text-transform:uppercase; letter-spacing:0.06em;">
                    Numero di domande
                </label>
                <input type="number" id="num-questions" class="num-input" min="1" value="10" aria-label="Numero di domande">
                <p id="num-hint" style="font-size:0.8rem; color:var(--text-muted); margin-top:0.3rem;"></p>
            </div>

            <div style="margin-top:1.5rem;">
                <button id="start-btn" class="btn-primary" disabled>
                    <i class="fa-solid fa-play" style="margin-right:0.4rem;"></i> Inizia il Quiz
                </button>
            </div>
        </div>
    </div>

    <!-- ============ QUIZ ============ -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-container">
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.25rem;">

        // ================================================================
        //  MAPPA AREA PRINCIPALE → SOTTOAREE
        //  Di default, la sottoarea viene suddivisa prendendo il prefisso
        //  prima del primo underscore, che viene poi "tradotto" in un
        //  nome leggibile. Modifica questa funzione per personalizzare
        //  la mappatura.
        // ================================================================

        function getMainAreaFromSubArea(subArea) {
            // Esempio: "CHI2_ACIDI_BASI" → "CHIMICA2"
            //           "BIO_Genetica"     → "BIOLOGIA"
            //           "MAT_Insiemi"      → "MATEMATICA"
            const prefix = subArea.split('_')[0] || subArea;

            const map = {
                'CHI2': 'CHIMICA2',
                'CHI': 'CHIMICA',
				'BIO2': 'BIOLOGIA2',
                'BIO': 'BIOLOGIA',
                'MAT': 'MATEMATICA',
				'MAT2': 'MATEMATICA2',
				'MAT3': 'PROBLEMI',
                'FIS': 'FISICA',
            };
            return map[prefix] || prefix;
        }

        // ================================================================
        //  FINE CONFIGURAZIONE — NON MODIFICARE SOTTO SE NON NECESSARIO
        // ================================================================

        const QUIZ_DATA = window.__QUIZ_DATA__ || [];

        // --- Helper per il rendering LaTeX ---
        let mathJaxReady = false;
        let mathJaxQueue = [];

        function renderLaTeX(element) {
            if (!element) return;
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([element]).catch(function(err) {
                    console.warn('MathJax typeset error:', err);
                });
            } else {
                // MathJax non ancora caricato: accoda la richiesta
                mathJaxQueue.push(element);
            }
        }

        function renderAllLaTeX() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                const elements = document.querySelectorAll('.math, .question-text, .option-btn, .feedback-box, .review-q-text, .review-opt-row');
                if (elements.length) {
                    window.MathJax.typesetPromise(Array.from(elements)).catch(function(err) {
                        console.warn('MathJax typeset error:', err);
                    });
                }
            }
        }

        // Quando MathJax è pronto, elabora la coda
        document.addEventListener('DOMContentLoaded', function() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                mathJaxReady = true;
                while (mathJaxQueue.length) {
                    const el = mathJaxQueue.shift();
                    window.MathJax.typesetPromise([el]).catch(function(err) {
                        console.warn('MathJax typeset error:', err);
                    });
                }
            }
        });

        // Se MathJax viene caricato dopo, intercetta l'evento
        document.addEventListener('MathJaxReady', function() {
            mathJaxReady = true;
            while (mathJaxQueue.length) {
                const el = mathJaxQueue.shift();
                window.MathJax.typesetPromise([el]).catch(function(err) {
                    console.warn('MathJax typeset error:', err);
                });
            }
        });

        // --- Stati ---
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;
        let userAnswers = [];
        let totalQuestions = 0;

        // --- DOM refs ---
        const setupScreen = document.getElementById('setup-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const mainAreaSelect = document.getElementById('main-area-select');
        const subAreaSelect = document.getElementById('sub-area-select');
        const subCount = document.getElementById('sub-count');
        const selectedAreasInfo = document.getElementById('selected-areas-info');
        const numQuestionsInput = document.getElementById('num-questions');
        const numHint = document.getElementById('num-hint');
        const startBtn = document.getElementById('start-btn');
        const qCounter = document.getElementById('q-counter');
        const qScore = document.getElementById('q-score');
        const progressFill = document.getElementById('progress-fill');
        const qAreaBadge = document.getElementById('q-area-badge');
        const qText = document.getElementById('q-text');
        const qOptions = document.getElementById('q-options');
        const feedbackContainer = document.getElementById('feedback-container');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const scorePct = document.getElementById('score-pct');
        const scoreFraction = document.getElementById('score-fraction');
        const resultMessage = document.getElementById('result-message');
        const reviewList = document.getElementById('review-list');
        const retryBtn = document.getElementById('retry-btn');
        const newSessionBtn = document.getElementById('new-session-btn');

        // --- Funzioni di estrazione dati ---
        function getAllSubAreas() {
            const areas = new Set();
            QUIZ_DATA.forEach(q => {
                if (q.area) areas.add(q.area);
            });
            return Array.from(areas).sort();
        }

        function getMainAreas() {
            const subAreas = getAllSubAreas();
            const mainMap = {};
            subAreas.forEach(sa => {
                const ma = getMainAreaFromSubArea(sa);
                if (!mainMap[ma]) mainMap[ma] = [];
                mainMap[ma].push(sa);
            });
            return Object.keys(mainMap).sort().map(ma => ({
                name: ma,
                subAreas: mainMap[ma].sort()
            }));
        }

        function getSubAreasForMain(mainArea) {
            const all = getMainAreas();
            const found = all.find(m => m.name === mainArea);
            return found ? found.subAreas : [];
        }

        function getQuestionsForSubAreas(subAreas) {
            return QUIZ_DATA.filter(q => subAreas.includes(q.area));
        }

        // --- Setup UI ---
        function populateMainAreas() {
            const mainAreas = getMainAreas();
            mainAreaSelect.innerHTML = '<option value="">-- Seleziona area principale --</option>';
            mainAreas.forEach(ma => {
                const opt = document.createElement('option');
                opt.value = ma.name;
                opt.textContent = `${ma.name} (${ma.subAreas.length} sottoaree)`;
                mainAreaSelect.appendChild(opt);
            });
            if (mainAreas.length === 0) {
                mainAreaSelect.innerHTML = '<option value="">-- Nessuna area disponibile --</option>';
            }
            updateSubAreas();
        }

        function updateSubAreas() {
            const selected = mainAreaSelect.value;
            subAreaSelect.innerHTML = '';
            let subAreas = [];
            let mainLabel = '';

            if (selected) {
                subAreas = getSubAreasForMain(selected);
                mainLabel = selected;
            } else {
                // Mostra tutte le sottoaree
                subAreas = getAllSubAreas();
                mainLabel = 'Tutte le aree';
            }

            if (subAreas.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '-- Nessuna sottoarea disponibile --';
                opt.disabled = true;
                subAreaSelect.appendChild(opt);
            } else {
                subAreas.forEach(sa => {
                    const opt = document.createElement('option');
                    opt.value = sa;
                    opt.textContent = sa;
                    opt.selected = true;
                    subAreaSelect.appendChild(opt);
                });
            }

            updateSubCount();
            updateStartButton();
        }

        function updateSubCount() {
            const selected = Array.from(subAreaSelect.selectedOptions).map(o => o.value);
            const count = selected.length;
            subCount.textContent = `(${count})`;
            updateSelectedInfo(selected);
            updateNumHint(selected);
        }

        function updateSelectedInfo(selected) {
            const main = mainAreaSelect.value;
            let html = '';
            if (main) {
                html += `<span class="tag main-tag"><i class="fa-solid fa-folder-open"></i> ${main}</span>`;
            }
            if (selected.length === 0) {
                html += `<span style="color:var(--text-muted);font-size:0.8rem;">Nessuna sottoarea selezionata</span>`;
            } else if (selected.length <= 5) {
                selected.forEach(s => {
                    html += `<span class="tag">${s}</span>`;
                });
            } else {
                html += `<span class="tag">${selected.length} sottoaree selezionate</span>`;
            }
            selectedAreasInfo.innerHTML = html;
        }

        function updateNumHint(selected) {
            const total = QUIZ_DATA.filter(q => selected.includes(q.area)).length;
            const desired = parseInt(numQuestionsInput.value) || 0;
            let hint = `${total} domande disponibili`;
            if (desired > total) {
                hint += ` — richieste ${desired}, saranno usate tutte le ${total} disponibili`;
            } else if (desired > 0 && total > 0) {
                hint += ` — ne verranno estratte ${Math.min(desired, total)}`;
            }
            numHint.textContent = hint;
        }

        function updateStartButton() {
            const selected = Array.from(subAreaSelect.selectedOptions).map(o => o.value);
            const hasData = QUIZ_DATA.length > 0;
            const hasSelection = selected.length > 0;
            const num = parseInt(numQuestionsInput.value) || 0;
            const totalAvailable = QUIZ_DATA.filter(q => selected.includes(q.area)).length;
            startBtn.disabled = !(hasData && hasSelection && num > 0 && totalAvailable > 0);
        }

        // --- Eventi setup ---
        mainAreaSelect.addEventListener('change', function() {
            updateSubAreas();
        });

        subAreaSelect.addEventListener('change', function() {
            updateSubCount();
            updateStartButton();
        });

        numQuestionsInput.addEventListener('input', function() {
            const selected = Array.from(subAreaSelect.selectedOptions).map(o => o.value);
            updateNumHint(selected);
            updateStartButton();
        });

        // --- Avvio quiz ---
        startBtn.addEventListener('click', function() {
            const selected = Array.from(subAreaSelect.selectedOptions).map(o => o.value);
            if (selected.length === 0) return;

            const allQuestions = getQuestionsForSubAreas(selected);
            if (allQuestions.length === 0) return;

            let num = parseInt(numQuestionsInput.value) || 10;
            num = Math.min(num, allQuestions.length);

            // Mescola e seleziona
            const shuffled = [...allQuestions];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            currentQuestions = shuffled.slice(0, num);
            totalQuestions = currentQuestions.length;
            currentIndex = 0;
            score = 0;
            userAnswers = [];
            answered = false;

            startQuiz();
        });

        function startQuiz() {
            showScreen('quiz');
            renderQuestion();
        }

        function renderQuestion() {
            if (currentIndex >= currentQuestions.length) {
                showResults();
                return;
            }

            const q = currentQuestions[currentIndex];
            answered = false;
            submitBtn.disabled = true;
            submitBtn.style.display = 'block';
            nextBtn.style.display = 'none';
            feedbackContainer.style.display = 'none';
            feedbackContainer.innerHTML = '';

            // Aggiorna contatore e progresso
            qCounter.textContent = `Domanda ${currentIndex + 1} / ${totalQuestions}`;
            qScore.textContent = `Corrette: ${score}`;
            progressFill.style.width = `${((currentIndex) / totalQuestions) * 100}%`;

            // Area
            qAreaBadge.textContent = q.area || '';

            // Testo domanda (con supporto LaTeX)
            qText.innerHTML = q.domanda;
            qText.classList.add('math');

            // Opzioni
            const letters = ['a', 'b', 'c', 'd', 'e'];
            const optionLabels = ['A', 'B', 'C', 'D', 'E'];
            qOptions.innerHTML = '';
            let hasCorrect = false;

            letters.forEach((key, idx) => {
                if (q[key] && q[key].trim()) {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.dataset.key = key;
                    btn.innerHTML = `
                        <span class="opt-letter">${optionLabels[idx]}</span>
                        <span>${q[key]}</span>
                    `;
                    btn.addEventListener('click', function() {
                        if (answered) return;
                        selectOption(key);
                    });
                    qOptions.appendChild(btn);
                    hasCorrect = true;
                }
            });

            if (!hasCorrect) {
                // Fallback: nessuna opzione valida
                qOptions.innerHTML = '<p style="color:var(--text-muted);">Nessuna opzione disponibile per questa domanda.</p>';
                submitBtn.disabled = true;
                return;
            }

            // Rende il LaTeX per questa domanda
            setTimeout(() => renderAllLaTeX(), 50);

            // Reset stato
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('selected', 'correct-answer', 'wrong-selected', 'dimmed', 'locked');
            });

            submitBtn.disabled = true;
            submitBtn.style.display = 'block';
            nextBtn.style.display = 'none';
        }

        let selectedKey = null;

        function selectOption(key) {
            if (answered) return;
            selectedKey = key;
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.dataset.key === key) {
                    btn.classList.add('selected');
                }
            });
            submitBtn.disabled = false;
        }

        // --- Submit ---
        submitBtn.addEventListener('click', function() {
            if (answered || !selectedKey) return;
            const q = currentQuestions[currentIndex];
            const isCorrect = selectedKey === q.risposta_corretta;
            if (isCorrect) score++;

            answered = true;
            submitBtn.disabled = true;
            submitBtn.style.display = 'none';

            // Mostra feedback
            const container = feedbackContainer;
            container.style.display = 'block';
            container.className = `feedback-box ${isCorrect ? 'correct' : 'wrong'}`;

            const correctLetter = q.risposta_corretta;
            const correctText = q[correctLetter] || '';

            const letterLabels = { a: 'A', b: 'B', c: 'C', d: 'D', e: 'E' };

            let html = `
                <div class="feedback-title">
                    <i class="fa-solid ${isCorrect ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                    ${isCorrect ? 'Corretto!' : 'Sbagliato!'}
                </div>
                <div style="font-size:0.95rem; line-height:1.5;">
                    <span style="color:var(--text-muted);">Risposta corretta:</span>
                    <span style="color:var(--correct); font-weight:600;">${letterLabels[correctLetter]}. ${correctText}</span>
                </div>
            `;

            if (q.spiegazione && q.spiegazione.trim()) {
                html += `
                    <div class="spiegazione-box">
                        <div class="spiegazione-label"><i class="fa-solid fa-lightbulb"></i> Spiegazione</div>
                        <div>${q.spiegazione}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
            renderAllLaTeX();

            // Evidenzia le opzioni
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.add('locked');
                const key = btn.dataset.key;
                if (key === correctLetter) {
                    btn.classList.add('correct-answer');
                } else if (key === selectedKey && !isCorrect) {
                    btn.classList.add('wrong-selected');
                } else if (key !== correctLetter && key !== selectedKey) {
                    btn.classList.add('dimmed');
                }
            });

            // Salva risposta
            userAnswers.push({
                question: q,
                selected: selectedKey,
                correct: isCorrect
            });

            // Mostra next
            nextBtn.style.display = 'block';
            if (currentIndex === totalQuestions - 1) {
                nextBtn.innerHTML = 'Vedi risultati <i class="fa-solid fa-flag-checkered" style="margin-left:0.35rem;"></i>';
            } else {
                nextBtn.innerHTML = 'Prossima <i class="fa-solid fa-arrow-right" style="margin-left:0.35rem;"></i>';
            }

            // Aggiorna punteggio
            qScore.textContent = `Corrette: ${score}`;
        });

        // --- Next ---
        nextBtn.addEventListener('click', function() {
            currentIndex++;
            if (currentIndex >= currentQuestions.length) {
                showResults();
            } else {
                renderQuestion();
                // Scorri in alto
                document.querySelector('.quiz-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });

        // --- Risultati ---
        function showResults() {
            showScreen('results');
            const total = currentQuestions.length;
            const pct = total > 0 ? Math.round((score / total) * 100) : 0;

            // Animazione anello
            const arc = document.getElementById('score-arc');
            const circumference = 326.73;
            const offset = circumference - (pct / 100) * circumference;
            arc.style.strokeDashoffset = offset;

            scorePct.textContent = `${pct}%`;
            scoreFraction.textContent = `${score}/${total}`;

            let msg = '';
            if (pct >= 90) msg = 'Eccellente! Hai una preparazione solida. 💪';
            else if (pct >= 70) msg = 'Buon lavoro! Continua a ripassare. 📚';
            else if (pct >= 50) msg = 'Puoi fare meglio. Rivedi le aree critiche. 🔍';
            else msg = 'Non scoraggiarti. Ripassa e riprova! 💪';
            resultMessage.textContent = msg;

            // Riepilogo
            reviewList.innerHTML = '';
            userAnswers.forEach((item, idx) => {
                const q = item.question;
                const isCorrect = item.correct;
                const div = document.createElement('div');
                div.className = `review-item ${isCorrect ? 'was-correct' : 'was-wrong'}`;

                const letterLabels = { a: 'A', b: 'B', c: 'C', d: 'D', e: 'E' };
                const correctLetter = q.risposta_corretta;

                let optionsHtml = '';
                const letters = ['a', 'b', 'c', 'd', 'e'];
                letters.forEach(key => {
                    if (q[key] && q[key].trim()) {
                        const isCorrectOpt = key === correctLetter;
                        const isSelected = key === item.selected;
                        let cls = 'review-opt-row';
                        if (isCorrectOpt) cls += ' rev-correct';
                        else if (isSelected && !isCorrectOpt) cls += ' rev-wrong';
                        optionsHtml += `
                            <div class="${cls}">
                                <span class="review-opt-letter">${letterLabels[key]}</span>
                                <span>${q[key]}</span>
                                ${isCorrectOpt ? ' <i class="fa-solid fa-check" style="margin-left:auto;color:var(--correct);"></i>' : ''}
                                ${isSelected && !isCorrectOpt ? ' <i class="fa-solid fa-times" style="margin-left:auto;color:var(--wrong);"></i>' : ''}
                            </div>
                        `;
                    }
                });

                div.innerHTML = `
                    <div class="review-status-icon ${isCorrect ? 'is-correct' : 'is-wrong'}">
                        <i class="fa-solid ${isCorrect ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                        ${isCorrect ? 'Corretta' : 'Sbagliata'}
                    </div>
                    <div class="review-q-text">${idx+1}. ${q.domanda}</div>
                    ${optionsHtml}
                    ${q.spiegazione ? `<div style="margin-top:0.6rem;font-size:0.85rem;color:var(--text-muted);padding:0.5rem 0.7rem;background:rgba(255,255,255,0.03);border-radius:6px;"><i class="fa-regular fa-lightbulb" style="margin-right:0.4rem;color:var(--accent);"></i>${q.spiegazione}</div>` : ''}
                `;
                reviewList.appendChild(div);
            });

            // Rende il LaTeX nei risultati
            setTimeout(() => renderAllLaTeX(), 100);
        }

        // --- Navigazione ---
        function showScreen(screen) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            if (screen === 'setup') setupScreen.classList.add('active');
            else if (screen === 'quiz') quizScreen.classList.add('active');
            else if (screen === 'results') resultsScreen.classList.add('active');
        }

        // --- Pulsanti risultati ---
        retryBtn.addEventListener('click', function() {
            // Ricomincia con le stesse domande
            currentIndex = 0;
            score = 0;
            userAnswers = [];
            answered = false;
            startQuiz();
        });

        newSessionBtn.addEventListener('click', function() {
            showScreen('setup');
            populateMainAreas();
            updateStartButton();
        });

        // --- Inizializzazione ---
        document.addEventListener('DOMContentLoaded', function() {
            populateMainAreas();
            updateStartButton();

            // Se ci sono dati, aggiorna il titolo
            if (QUIZ_DATA.length > 0) {
                const areas = getAllSubAreas();
                document.getElementById('setup-title').textContent =
                    `${areas.length} sottoaree · ${QUIZ_DATA.length} domande`;
            } else {
                document.getElementById('setup-title').textContent =
                    '⚠️ Nessun dato caricato — inserisci le domande in __QUIZ_DATA__';
            }

            // Rende il LaTeX iniziale se presente
            setTimeout(renderAllLaTeX, 300);
        });

        // Rende il LaTeX anche dopo il caricamento di MathJax
        if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise().catch(function(err) {
                console.warn('MathJax initial typeset error:', err);
            });
        }

        console.log('✅ Quiz script caricato. Aggiungi le tue domande in window.__QUIZ_DATA__');
        console.log(`📊 ${QUIZ_DATA.length} domande attualmente caricate.`);
    </script>

</body>
</html>
